<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Rectangle Crop Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    #controls {
      margin-bottom: 10px;
    }

    #canvas-wrapper {
      margin-bottom: 30px;
      overflow: visible;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border: 1px solid black;
    }

    #pdf-canvas {
      z-index: 1;
    }

    #overlay-canvas {
      z-index: 2;
      pointer-events: auto;
    }

    #result-container {
      margin-top: 20px;
    }

    .cropped-block {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .cropped-image {
      border: 1px solid #999;
      display: block;
      max-width: 600px;
      max-height: 400px;
      width: auto;
      height: auto;
    }

    .label-dropdown {
      font-size: 14px;
    }

    #save-images {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Draw Rectangles on PDF and View Crops</h2>

  <div id="controls">
    <input type="file" id="pdf-file" accept="application/pdf">
    <button id="rotate-btn" disabled>Rotate 90°</button>
    <button id="zoom-out-btn" disabled>Zoom Out (-)</button>
    <button id="zoom-in-btn" disabled>Zoom In (+)</button>
    <span id="zoom-level" style="margin-left: 10px; font-weight: bold;">100%</span>
    <button id="show-results" disabled>Save and Show All Selected Rectangles</button>
  </div>

  <div id="canvas-wrapper">
    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
    </div>
  </div>

  <div id="debug-info" style="margin-top: 10px; font-family: monospace; font-size: 14px;">
    Mouse: <span id="mouse-coords">-</span> |
    Rect Start: <span id="rect-start">-</span> |
    Rect End: <span id="rect-end">-</span>
  </div>

  <h3 id="crop-label" style="display: none;">Cropped Rectangles:</h3>
  <div id="result-container"></div>

  <button id="save-images" style="display: none;">Save Cropped Images to Server</button>

  <form id="save-form" method="post" action="save_crops.php">
    <input type="hidden" name="imagesJson" id="imagesJson">
    <input type="hidden" name="originalFileName" id="originalFileName">
    <input type="hidden" name="harmonized" id="harmonized" value="">
  </form>

  <script>
    const pdfCanvas = document.getElementById('pdf-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');

    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');

    const rectangles = [];
    let startX, startY, endX, endY, isDrawing = false;
    let pdfImage;

    const pdfjsLib = window['pdfjs-dist/build/pdf'];

    // Check if PDF URL is provided in query parameters (harmonized mode)
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('pdf');
    const harmonizedMode = urlParams.get('harmonized') === 'true';

    // Track display scale for coordinate conversion
    let displayScale = 1;
    let baseDisplayScale = 1; // Store the initial auto-calculated scale
    let zoomLevel = 1.0; // User zoom multiplier (1.0 = 100%)
    let currentRotation = 0; // Track rotation in degrees (0, 90, 180, 270)

    // Function to load and render PDF
    async function loadAndRenderPDF(source, fileName) {
      const baseName = fileName ? fileName.replace(/\.[^/.]+$/, "") : "invoice";
      document.getElementById("originalFileName").value = baseName;

      pdfjsLib.getDocument(source).promise.then(async pdf => {
          const numPages = pdf.numPages;

          // Use high render scale for quality crops (1.5 is good baseline)
          const renderScale = 1.5;

          // Get all pages and calculate total height
          const pagePromises = [];
          for (let i = 1; i <= numPages; i++) {
            pagePromises.push(pdf.getPage(i));
          }

          const pages = await Promise.all(pagePromises);
          const viewports = pages.map(page => page.getViewport({ scale: renderScale }));

          // Calculate canvas dimensions (same width, sum of heights)
          const maxWidth = Math.max(...viewports.map(vp => vp.width));
          const totalHeight = viewports.reduce((sum, vp) => sum + vp.height, 0);

          pdfCanvas.width = overlayCanvas.width = maxWidth;
          pdfCanvas.height = overlayCanvas.height = totalHeight;

          // Calculate base display scale to fit screen (target ~900px width)
          const targetDisplayWidth = Math.min(900, window.innerWidth - 50);
          baseDisplayScale = targetDisplayWidth / maxWidth;
          displayScale = baseDisplayScale * zoomLevel;

          // Apply CSS transform to scale display (keeps canvas at full resolution)
          const container = document.getElementById('canvas-container');
          container.style.transform = `scale(${displayScale}) rotate(${currentRotation}deg)`;

          // Adjust container's layout dimensions to match visual size
          container.style.width = maxWidth + 'px';
          container.style.height = totalHeight + 'px';

          // Set wrapper dimensions to match the scaled visual size
          const wrapper = document.getElementById('canvas-wrapper');
          wrapper.style.minWidth = (maxWidth * displayScale) + 'px';
          wrapper.style.minHeight = (totalHeight * displayScale) + 'px';

          // Update zoom level display
          document.getElementById('zoom-level').textContent = Math.round(zoomLevel * 100) + '%';

          // Render all pages sequentially, stacking them vertically
          let currentY = 0;
          for (let i = 0; i < pages.length; i++) {
            const page = pages[i];
            const viewport = viewports[i];

            // Save canvas state
            pdfCtx.save();

            // Translate to the correct Y position for this page
            pdfCtx.translate(0, currentY);

            const renderContext = {
              canvasContext: pdfCtx,
              viewport: viewport
            };

            await page.render(renderContext).promise;

            // Restore canvas state
            pdfCtx.restore();

            currentY += viewport.height;
          }

          // After all pages are rendered, create the image
          pdfImage = new Image();
          pdfImage.src = pdfCanvas.toDataURL("image/png");
          document.getElementById("show-results").disabled = false;
          document.getElementById("rotate-btn").disabled = false;
          document.getElementById("zoom-in-btn").disabled = false;
          document.getElementById("zoom-out-btn").disabled = false;
        });
    }

    // Manual file selection handler
    document.getElementById('pdf-file').addEventListener('change', function(e) {
      const pdfFile = e.target.files[0];
      const fileName = pdfFile.name;

      const fileReader = new FileReader();
      fileReader.onload = function() {
        const typedarray = new Uint8Array(this.result);
        loadAndRenderPDF(typedarray, fileName);
      };
      fileReader.readAsArrayBuffer(pdfFile);
    });

    // Auto-load PDF if URL parameter is provided (harmonized mode)
    if (pdfUrl && harmonizedMode) {
      // Hide file input in harmonized mode
      document.getElementById('pdf-file').style.display = 'none';

      // Set harmonized flag in form
      document.getElementById('harmonized').value = 'true';

      // Extract filename from URL
      const fileName = decodeURIComponent(pdfUrl.split('/').pop());

      // Load PDF from URL
      loadAndRenderPDF(pdfUrl, fileName);
    }

    // Helper function to update the transform and wrapper dimensions
    function updateViewTransform() {
      displayScale = baseDisplayScale * zoomLevel;

      const w = pdfCanvas.width * displayScale;
      const h = pdfCanvas.height * displayScale;

      // Calculate translation based on rotation
      let translateX = 0;
      let translateY = 0;

      if (currentRotation === 0) {
        translateX = 0;
        translateY = 0;
      } else if (currentRotation === 90) {
        translateX = h;
        translateY = 0;
      } else if (currentRotation === 180) {
        translateX = w;
        translateY = h;
      } else if (currentRotation === 270) {
        translateX = 0;
        translateY = w;
      }

      // Apply transform
      const container = document.getElementById('canvas-container');
      container.style.transform = `scale(${displayScale}) translate(${translateX / displayScale}px, ${translateY / displayScale}px) rotate(${currentRotation}deg)`;

      // Adjust wrapper dimensions based on rotation
      const wrapper = document.getElementById('canvas-wrapper');

      if (currentRotation === 90 || currentRotation === 270) {
        wrapper.style.minWidth = (pdfCanvas.height * displayScale) + 'px';
        wrapper.style.minHeight = (pdfCanvas.width * displayScale) + 'px';
      } else {
        wrapper.style.minWidth = (pdfCanvas.width * displayScale) + 'px';
        wrapper.style.minHeight = (pdfCanvas.height * displayScale) + 'px';
      }

      // Update zoom level display
      document.getElementById('zoom-level').textContent = Math.round(zoomLevel * 100) + '%';
    }

    // Zoom In button handler
    document.getElementById('zoom-in-btn').addEventListener('click', function() {
      // Increase zoom by 25%, max 400%
      if (zoomLevel < 4.0) {
        zoomLevel = Math.min(4.0, zoomLevel + 0.25);
        updateViewTransform();
      }
    });

    // Zoom Out button handler
    document.getElementById('zoom-out-btn').addEventListener('click', function() {
      // Decrease zoom by 25%, min 25%
      if (zoomLevel > 0.25) {
        zoomLevel = Math.max(0.25, zoomLevel - 0.25);
        updateViewTransform();
      }
    });

    // Rotate button handler
    document.getElementById('rotate-btn').addEventListener('click', function() {
      // Increment rotation by 90 degrees
      currentRotation = (currentRotation + 90) % 360;

      // Update the view
      updateViewTransform();

      // Clear any existing rectangles as coordinates need recalculation
      rectangles.length = 0;
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    });

    overlayCanvas.addEventListener('mousedown', function(e) {
      // Get mouse position relative to the page
      const rect = overlayCanvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      // The bounding rect changes with rotation, so we need to convert coordinates
      // based on the current rotation to get the actual canvas pixel position
      const w = pdfCanvas.width;
      const h = pdfCanvas.height;

      let canvasX, canvasY;

      if (currentRotation === 0) {
        canvasX = clientX / displayScale;
        canvasY = clientY / displayScale;
      } else if (currentRotation === 90) {
        // After 90° rotation, the bounding box is rotated
        // Visual top-left is actually canvas top-right
        canvasX = clientY / displayScale;
        canvasY = h - (clientX / displayScale);
      } else if (currentRotation === 180) {
        canvasX = w - (clientX / displayScale);
        canvasY = h - (clientY / displayScale);
      } else if (currentRotation === 270) {
        canvasX = w - (clientY / displayScale);
        canvasY = clientX / displayScale;
      }

      startX = canvasX;
      startY = canvasY;

      // Debug output
      document.getElementById('mouse-coords').textContent = `Client:(${Math.round(clientX)}, ${Math.round(clientY)})`;
      document.getElementById('rect-start').textContent = `Canvas:(${Math.round(startX)}, ${Math.round(startY)})`;

      isDrawing = true;
    });

    overlayCanvas.addEventListener('mousemove', function(e) {
      if (!isDrawing) return;

      const rect = overlayCanvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      // Convert coordinates based on rotation
      const w = pdfCanvas.width;
      const h = pdfCanvas.height;

      let canvasX, canvasY;

      if (currentRotation === 0) {
        canvasX = clientX / displayScale;
        canvasY = clientY / displayScale;
      } else if (currentRotation === 90) {
        canvasX = clientY / displayScale;
        canvasY = h - (clientX / displayScale);
      } else if (currentRotation === 180) {
        canvasX = w - (clientX / displayScale);
        canvasY = h - (clientY / displayScale);
      } else if (currentRotation === 270) {
        canvasX = w - (clientY / displayScale);
        canvasY = clientX / displayScale;
      }

      endX = canvasX;
      endY = canvasY;

      // Debug output
      document.getElementById('mouse-coords').textContent = `Client:(${Math.round(clientX)}, ${Math.round(clientY)})`;
      document.getElementById('rect-end').textContent = `Canvas:(${Math.round(endX)}, ${Math.round(endY)})`;

      const x = Math.min(startX, endX);
      const y = Math.min(startY, endY);
      const width = Math.abs(endX - startX);
      const height = Math.abs(endY - startY);

      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // Scale line width inversely to display scale for consistent visual thickness
      const visualLineWidth = 2 / displayScale;

      for (const r of rectangles) {
        overlayCtx.strokeStyle = 'red';
        overlayCtx.lineWidth = visualLineWidth;
        overlayCtx.strokeRect(r.x, r.y, r.width, r.height);
      }

      overlayCtx.strokeStyle = 'blue';
      overlayCtx.lineWidth = visualLineWidth;
      overlayCtx.strokeRect(x, y, width, height);
    });

    overlayCanvas.addEventListener('mouseup', function(e) {
      if (!isDrawing) return;
      isDrawing = false;

      const rect = overlayCanvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      // Convert coordinates based on rotation
      const w = pdfCanvas.width;
      const h = pdfCanvas.height;

      let canvasX, canvasY;

      if (currentRotation === 0) {
        canvasX = clientX / displayScale;
        canvasY = clientY / displayScale;
      } else if (currentRotation === 90) {
        canvasX = clientY / displayScale;
        canvasY = h - (clientX / displayScale);
      } else if (currentRotation === 180) {
        canvasX = w - (clientX / displayScale);
        canvasY = h - (clientY / displayScale);
      } else if (currentRotation === 270) {
        canvasX = w - (clientY / displayScale);
        canvasY = clientX / displayScale;
      }

      endX = canvasX;
      endY = canvasY;

      const x = Math.min(startX, endX);
      const y = Math.min(startY, endY);
      const width = Math.abs(endX - startX);
      const height = Math.abs(endY - startY);

      rectangles.push({ x, y, width, height });

      // Scale line width inversely to display scale for consistent visual thickness
      const visualLineWidth = 2 / displayScale;

      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      for (const r of rectangles) {
        overlayCtx.strokeStyle = 'red';
        overlayCtx.lineWidth = visualLineWidth;
        overlayCtx.strokeRect(r.x, r.y, r.width, r.height);
      }
    });

    document.getElementById('show-results').addEventListener('click', function() {
      // Show label and save button
      document.getElementById("crop-label").style.display = "block";
      document.getElementById("save-images").style.display = "inline-block";

      const resultContainer = document.getElementById('result-container');
      resultContainer.innerHTML = '';

      const totalRects = rectangles.length;

      rectangles.forEach((rect, index) => {
        const { x, y, width, height } = rect;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = width;
        tempCanvas.height = height;

        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(pdfImage, x, y, width, height, 0, 0, width, height);

        const img = new Image();
        img.src = tempCanvas.toDataURL("image/png");
        img.className = 'cropped-image';

        const dropdown = document.createElement('select');
        dropdown.className = 'label-dropdown';
        const options = ['Date', 'InvoiceNo', 'Table', 'Total'];

        options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt;
          dropdown.appendChild(option);
        });

        if (index === 0) dropdown.value = 'Date';
        else if (index === 1) dropdown.value = 'InvoiceNo';
        else if (index === totalRects - 1) dropdown.value = 'Total';
        else dropdown.value = 'Table';

        const block = document.createElement('div');
        block.className = 'cropped-block';
        block.appendChild(img);
        block.appendChild(dropdown);

        resultContainer.appendChild(block);
      });
    });

    document.getElementById("save-images").addEventListener("click", () => {
      const blocks = document.querySelectorAll(".cropped-block");
      const baseName = document.getElementById("originalFileName").value;

      const dataToSend = [];

      blocks.forEach(block => {
        const img = block.querySelector("img");
        const dropdown = block.querySelector("select");

        dataToSend.push({
          label: dropdown.value,
          imageData: img.src
        });
      });

      document.getElementById("imagesJson").value = JSON.stringify(dataToSend);
      document.getElementById("save-form").submit();
    });
  </script>
</body>
</html>
